name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js & OpenNext Worker
        run: npm run build:worker
        env:
          SKIP_ENV_VALIDATION: "true"
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY || 'placeholder_sarvam_api_key' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'placeholder_groq_api_key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder_gemini_api_key' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'placeholder_clerk_secret_key' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://build:build@localhost:5432/build' }}
          ABDM_CLIENT_ID: ${{ secrets.ABDM_CLIENT_ID || 'placeholder_abdm_client_id' }}
          ABDM_CLIENT_SECRET: ${{ secrets.ABDM_CLIENT_SECRET || 'placeholder_abdm_client_secret' }}
          CLERK_BYPASS: ${{ secrets.CLERK_BYPASS || 'true' }}

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
